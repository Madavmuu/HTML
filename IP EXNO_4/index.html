<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Portal Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0066ff,#00c6ff);
}

.container{
    width:100%;
    max-width:420px;
    padding:20px;
}

.login-box{
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#0066ff;
    font-size:30px;
}

.logo p{
    color:#666;
    margin-top:8px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.input-group input:focus{
    border-color:#0066ff;
    outline:none;
}

.password-box{
    position:relative;
}

.password-box span{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#0066ff;
    font-size:14px;
    font-weight:bold;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#0066ff;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#0066ff;
    color:#fff;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0050d4;
}

.register{
    margin-top:20px;
    text-align:center;
}

.register a{
    color:#0066ff;
    text-decoration:none;
    font-weight:bold;
}

.error{
    color:red;
    font-size:13px;
    margin-top:5px;
}

.success{
    color:green;
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

@media(max-width:500px){

.login-box{
    padding:25px;
}

.logo h1{
    font-size:25px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="login-box">

<div class="logo">
<h1>Job Portal</h1>
<p>Login to Continue</p>
</div>

<form id="loginForm">

<div class="input-group">
<label>Email</label>
<input type="email" id="email" placeholder="Enter Email">
<div class="error" id="emailError"></div>
</div>

<div class="input-group">
<label>Password</label>

<div class="password-box">
<input type="password" id="password" placeholder="Enter Password">
<span onclick="togglePassword()">Show</span>
</div>

<div class="error" id="passwordError"></div>

</div>

<div class="options">
<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">
Login
</button>

<div class="success" id="success"></div>

</form>

<div class="register">
Don't have an account?
<a href="file:///C:/Users/HP/Desktop/internet%20programming/IP%20EXNO_4/home.html">Register</a>
</div>

</div>

</div>

<script>

const form=document.getElementById("loginForm");

form.addEventListener("submit",function(e){

e.preventDefault();

document.getElementById("emailError").innerHTML="";
document.getElementById("passwordError").innerHTML="";
document.getElementById("success").innerHTML="";

let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value.trim();

let valid=true;

let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

if(email==""){
document.getElementById("emailError").innerHTML="Email is required";
valid=false;
}
else if(!email.match(emailPattern)){
document.getElementById("emailError").innerHTML="Enter a valid email";
valid=false;
}

if(password==""){
document.getElementById("passwordError").innerHTML="Password is required";
valid=false;
}
else if(password.length<8){
document.getElementById("passwordError").innerHTML="Minimum 8 characters required";
valid=false;
}
else if(!/(?=.*[A-Z])/.test(password)){
document.getElementById("passwordError").innerHTML="Must contain one uppercase letter";
valid=false;
}
else if(!/(?=.*[a-z])/.test(password)){
document.getElementById("passwordError").innerHTML="Must contain one lowercase letter";
valid=false;
}
else if(!/(?=.*\d)/.test(password)){
document.getElementById("passwordError").innerHTML="Must contain one number";
valid=false;
}
else if(!/(?=.*[@$!%*?&])/.test(password)){
document.getElementById("passwordError").innerHTML="Must contain one special character";
valid=false;
}

if(valid){
document.getElementById("success").innerHTML="✅ Login Successful!";
form.reset();
}

});

function togglePassword(){

let password=document.getElementById("password");

if(password.type==="password"){
password.type="text";
event.target.innerHTML="Hide";
}
else{
password.type="password";
event.target.innerHTML="Show";
}

}

</script>

</body>
</html>
